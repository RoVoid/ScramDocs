# Сборка и деплой VitePress на GitHub Pages (pnpm)
name: Deploy VitePress site to Pages

on:
    # Запуск при пуше в main (если основная ветка master — замените)
    push:
        branches: [main]

    # Ручной запуск из вкладки Actions
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Один деплой за раз; уже идущий деплой не отменяем
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0 # нужен только если включён lastUpdated

            # pnpm нужно поставить ДО setup-node, иначе cache: pnpm не сработает
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10 # уберите, если в package.json задано "packageManager": "pnpm@..."

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Cache VitePress
              uses: actions/cache@v4
              with:
                  path: docs/.vitepress/cache
                  key: ${{ runner.os }}-vitepress-${{ hashFiles('docs/**', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-vitepress-

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build with VitePress
              run: pnpm docs:build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: docs/.vitepress/dist

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest
        name: Deploy
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
